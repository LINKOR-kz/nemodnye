<style>
body { background: #0A0A0A; color: #fff; min-height: 100vh; min-height: 100dvh; }
.pick { position: relative; overflow: hidden; min-height: 100vh; min-height: 100dvh; display: grid; align-content: center; padding: 48px 0 56px; isolation: isolate; }
.pick__head { text-align: center; display: grid; justify-items: center; gap: 18px; margin-bottom: 44px; }
.pick__head .bn-logo { width: 96px; filter: drop-shadow(0 12px 32px rgba(166,221,30,.35)); }
.pick__head h1 { margin: 0; font: 900 clamp(34px, 5vw, 60px)/1 var(--display); text-transform: uppercase; letter-spacing: -.04em; }
.pick__head h1 b { color: var(--lime); }
.pick__head p { margin: 0; color: rgba(255,255,255,.6); font-weight: 600; font-size: 17px; }
.cities { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: min(980px, 100%); margin: 0 auto; }
.city { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 440px; border-radius: 30px; overflow: hidden; padding: 28px; color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.1); transition: transform .35s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s; }
.city img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .8s ease; }
.city::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,10,10,0) 25%, rgba(10,10,10,.92) 85%); }
.city:hover { transform: translateY(-6px); box-shadow: 0 0 0 2px var(--lime), 0 30px 60px -20px rgba(166,221,30,.35); }
.city:hover img { transform: scale(1.06); }
.city h2 { margin: 0; font: 900 clamp(32px, 4vw, 46px)/1 var(--display); text-transform: uppercase; letter-spacing: -.04em; }
.city p { margin: 10px 0 0; color: rgba(255,255,255,.75); font-weight: 600; }
.city .go { margin-top: 20px; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 99px; background: var(--lime); color: var(--ink); font-weight: 800; }
.city .go svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 720px) { .cities { grid-template-columns: 1fr; } .city { min-height: 300px; padding: 22px; } }
</style>
</head>
<body>
<main class="pick">
  <div class="hero__glow" aria-hidden="true"></div>
  <div class="hero__ghost" aria-hidden="true">НЕМОДНЫЕ</div>
  <div class="wrap">
    <div class="pick__head"><svg class="bn-logo" viewBox="0 0 120 120" role="img" aria-label="Братья Немодные"><rect width="120" height="120" rx="22" fill="#A6DD1E"/><g fill="#0A0A0A" font-family="Unbounded, Arial Black, sans-serif" font-weight="900"><text x="15" y="35" font-size="17.5" textLength="90" lengthAdjust="spacingAndGlyphs">БРАТЬЯ</text><text transform="translate(120 0) scale(-1 1)" x="13" y="84" font-size="56" textLength="94" lengthAdjust="spacingAndGlyphs">НЕ</text><text x="15" y="104" font-size="17.5" textLength="90" lengthAdjust="spacingAndGlyphs">МОДНЫЕ</text></g></svg><h1>Админ-<b>панель</b></h1><p>У каждого города своя админка и свой пароль</p></div>
    <div class="cities">
      <a class="city" href="karaganda/admin.html"><img src="media/store-front.webp" alt=""><h2>Караганда</h2><p>пр. Бухар-жырау, 53а · ежедневно 10:00–20:00</p><span class="go">Админка Караганды <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
      <a class="city" href="astana/admin.html"><img src="media/showroom-led.webp" alt=""><h2>Астана</h2><p>ул. Керей-Жанибек хандар, 44/4 · ежедневно 11:00–21:00</p><span class="go">Админка Астаны <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    </div>
  </div>
</main>
</body>
</html>
